name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  release:
    name: Release to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'raulrod16124/raulrod-ui'

    steps:
      # `persist-credentials: false` (evaluado al fijar la action, ver abajo):
      # nada de este job empuja con git CLI — la action versiona y etiqueta por
      # API de GitHub con el `github-token` por defecto, y `changeset publish`
      # solo crea tags locales. Los checkout de ci.yml/storybook quedan como estaban.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same cache and key as `ci.yml`: the four gate commands below are all
      # `turbo run`, so without it every push to `main` re-does the work a PR on
      # the same commit already did — on the job that publishes.
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Quality gate (RRU-112). `ci.yml` only runs on `pull_request`, so before
      # this step the only automated check on the way to npm was `changesets/
      # action` itself — the job that publishes is not the job that verifies.
      # `changesets/action` is deliberately LAST: it is the only step that both
      # writes a commit and talks to the registry, so every gate below runs
      # first and a red build never reaches `npm publish`.
      #
      # The five commands below mirror `ci.yml`'s quality gate in the same
      # order (the WHY of each lives on its step there), so a PR that is green
      # is not re-litigated with different rules on the way out —
      # `check:changesets` included: it is a pure function of the tree, and
      # this job is where a bad merge combination would otherwise surface as
      # the opaque parse error that killed the 1.1.0 release attempt.
      # `pnpm release` below already runs `turbo run build --force`, and a
      # separate `pnpm build` here would only duplicate it; `ci.yml` covers
      # the build and the demo-claims check for every PR.
      - name: Validate changesets
        run: pnpm check:changesets

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Fijada a un SHA de `main` en vez de `@v1`: la última tag publicada
      # (v1.9.0, 3 jun 2026) detecta lo publicado con el regex de stdout
      # `New tag:\s+…` (src/run.ts) y @changesets/cli 3.x ya no imprime esa
      # línea — publica y etiqueta en local, escribe NDJSON a
      # $CHANGESETS_OUTPUT y solo anuncia `Created git tags:`. Resultado: 0
      # coincidencias → pushTag/createRelease nunca corrían, el step quedaba
      # en verde y el remoto acumuló 0 tags/releases en 1.0.0, 1.0.1 y 1.1.0.
      # `main` lee ese NDJSON (flujo diseñado para el CLI 3.x), renombra los
      # inputs de abajo (`throwOnRenamedInputs` hace que el nombre viejo
      # falle ruidosamente) y empuja tags y commits por API — por eso el
      # checkout puede ir con `persist-credentials: false`. Re-fijar a la
      # próxima tag publicada que incluya el flujo NDJSON.
      - name: Create Release PR or Publish to npm
        uses: changesets/action@615034bb14e5d240e559f941ce9769beb5e14fb0
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore(root): version packages"
          pr-title: "chore(root): version packages"
          create-github-releases: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
