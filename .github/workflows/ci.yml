name: CI

on:
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Changesets are plain markdown until something parses them, and on the
      # happy path the first parser is `changesets/action` in release.yml —
      # which runs on push to main, AFTER the merge. rru-141/142/143 were
      # committed without their opening "---" (2026-10-06): every check on
      # PR #16 stayed green, the merge landed, and the release job then died
      # on the parse error — no Release PR, nothing published. This step
      # moves that failure onto the PR, where it is cheap to fix.
      #
      # The tool replays the release step's own input validation (config,
      # frontmatter, bump types, workspace package names) as a pure function
      # of the working tree, then prints the plan. It is NOT
      # `changeset status`, which failed twice as a PR gate: its
      # `git merge-base` against "main" dies on shallow PR checkouts, and
      # its "packages changed but no changesets were found" policy rejects
      # the Release PR itself — the one branch where `changeset version` has
      # correctly consumed every changesets. A gate must survive the PR that
      # publishes. Needs no build, so it runs before anything heavier.
      - name: Validate changesets
        run: pnpm check:changesets

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # DEMO.md is the document a reviewer reads first, and prose is not compiled:
      # it rots by being almost right — a renamed file, a deleted script, a stale
      # count. This step re-derives its claims from the tree. Unlike the
      # `external-install` job it is BLOCKING, and the asymmetry is the point: it
      # needs no network, no browser and no build output, so there is nothing in it
      # that can fail for a reason that is not the repository's fault. It runs last
      # because it is the only step that reads the finished state of the tree.
      - name: Demo claims
        run: pnpm check:demo

  # Runs in parallel with the quality gate instead of after it: the suite is
  # Chromium-only and cold (~1 min of install), and a failing interaction should
  # not have to wait for a green build job to say so.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed by the lockfile because the browser revision travels with the
      # @playwright/test version, so a bump must miss this cache.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` installs the system libraries Chromium links against. A
      # bare runner fails to launch the browser, which would look like a product
      # bug on the first run of a new image.
      - name: Install Chromium
        run: pnpm --filter=@raulrod/playground exec playwright install --with-deps chromium

      # No Turborepo cache here on purpose: `test:e2e` depends on `build`, and a
      # cold build is the honest check — restoring `dist` would let the suite pass
      # against artifacts the current source no longer produces.
      - name: E2E
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: apps/playground/playwright-report/
          retention-days: 7

  # Dependency security gate (RRU-102). Two thresholds, not one, because the
  # two dependency sets have different consequences and very different sizes:
  # the PUBLISHED surface is 3 packages carrying ONE third-party runtime
  # dependency (lucide-react) plus the react/react-dom peers, so a moderate
  # advisory there is ours to fix; the ~700 devDependencies are tooling (Storybook, Vite, Vitest, Playwright) whose
  # advisories usually arrive without an upstream fix, and blocking every merge
  # on them trains the team to ignore the gate. Splitting the thresholds keeps
  # "moderate and above must be clean where it reaches consumers" true while
  # staying fixable.
  #
  # `--ignore-registry-errors` on both: a registry outage must not turn a green
  # repo red for something that is not a finding. It cannot mask a real
  # advisory — that still fails, it only stops registry errors from failing.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Needed because the published set is resolved per workspace project:
      # `--prod` audits the importers' production dependencies, which the
      # lockfile alone does not attribute. `--frozen-lockfile` also makes this
      # the check that the lockfile a reviewer reads is the one being audited.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit published dependencies (moderate and above)
        run: pnpm audit --prod --audit-level moderate --ignore-registry-errors

      - name: Audit dev dependencies (high and above)
        run: pnpm audit --audit-level high --ignore-registry-errors

  # Bundle-size regression gate. Runs in parallel with the quality gate because
  # it performs its own tree-shake build; a failure here must not mask lint /
  # typecheck / test failures, and vice versa.
  size-limit:
    name: Bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle size check
        run: pnpm size-limit

  # "What does someone outside this repository actually receive?" (RRU-131).
  # `tools/external-install-check.mjs` is the only check that answers it, and
  # until now it only ran by hand, so a PR could merge with the install broken
  # and a consumer would be the first to say so. Without a job in ci.yml the
  # question had no owner.
  #
  # `--route=tarball` and NOT `registry`: this job answers "would the next
  # release be installable", which is a property of the tree under review.
  # `registry` installs `@latest`, so a failure there is about a past release,
  # and it would turn every PR red for a commit that cannot fix it. It stays a
  # release-time check, run by hand before publishing.
  #
  # `continue-on-error` for the same reason as the `audit` job above: this route
  # needs the network (npm installs React, Vite and TypeScript into the
  # throwaway project) and a clean runner, so it fails for reasons that are not
  # a package bug. A gate that goes red on infrastructure teaches the repo to
  # ignore the gate. The honest consequence: this job EXECUTES the check, it does
  # not PROTECT the merge — `SECURITY.md` must not promise otherwise.
  external-install:
    name: External install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The route starts with `pnpm pack`, which ships `files: ["dist", ...]`, so
      # the packages must be built first or the tarball is empty and the check
      # would "pass" against an install with no library in it. Turborepo's cache
      # is safe here in a way it is not for E2E: a stale `dist` cannot make the
      # install succeed, it can only make it fail with a missing export.
      - name: Build
        run: pnpm build

      # No Chromium pass (`--no-browser`): the `e2e` job already installs and
      # caches the browser, and the theme check in a real browser is covered
      # there. Duplicating it would cost minutes per PR to re-answer a question
      # this route answers as text in the built CSS — and the run says so
      # instead of claiming a browser verified the theme.
      #
      # React 19 only, which is the default: this is the major every other route
      # in the repo exercises. The declared peer floor (`>=18.2.0`) is checked by
      # `pnpm verify:external:react18`, which stays manual — one major per run
      # proves nothing about the other, so the two are separate runs on purpose.
      - name: External install check
        run: pnpm verify:external --route=tarball --no-browser
